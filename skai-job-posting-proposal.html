<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skai Job Posting — Proposed Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafb; --surface: #fff; --surface-2: #f3f6f8; --ink: #262b2f; --body: #495259; --muted: #68727a; --faint: #8b949b;
    --line: #dfe4e8; --line-2: #d3dade; --track: #e7edf1;
    --slate: #547691; --slate-d: #3e566a; --slate-dd: #2c3e4c; --slate-tint: #eef3f6; --slate-tint-2: #e2ebf0;
    --ok: #3f9e83; --ok-tint: #e5f4ee; --amber: #c98a2e; --amber-tint: #faf1e2; --danger: #b4462f;
    --shadow: 0 18px 48px rgba(65, 82, 96, .10); --shadow-sm: 0 2px 10px rgba(65, 82, 96, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171b; --surface: #1b2227; --surface-2: #20282e; --ink: #eef2f5; --body: #c3cbd1; --muted: #9aa5ad; --faint: #7d8991;
      --line: #2b343b; --line-2: #36414a; --track: #27313a;
      --slate: #7fa2bd; --slate-d: #9bbad1; --slate-dd: #cfe0ec; --slate-tint: #1f2a33; --slate-tint-2: #2b3842;
      --ok: #55b99c; --ok-tint: #1c2f2a; --amber: #e0a24a; --amber-tint: #3a2f1c;
      --shadow: 0 18px 48px rgba(0, 0, 0, .4); --shadow-sm: 0 2px 10px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box }
  html, body { margin: 0 }
  body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; min-height: 100vh }
  h1, h2, h3 { font-family: Manrope, sans-serif; margin: 0; letter-spacing: -.01em }
  button { font: inherit; cursor: pointer }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; transition: border-color .15s, transform .15s, background .15s }
  .btn:hover { border-color: var(--slate) }
  .btn.p { background: linear-gradient(135deg, var(--slate-dd), var(--slate)); border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(44, 62, 76, .25) }
  .btn.p:hover { transform: translateY(-1px) }
  .btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 10px }
  .btn:disabled { opacity: .5; cursor: not-allowed }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line) }
  .top-in { max-width: 860px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--slate-dd), var(--slate)); color: #fff; font: 800 13px Manrope }
  .crumb { font-size: 13px; color: var(--muted) }
  .crumb b { color: var(--ink); display: block; font-size: 14.5px; font-family: Manrope }
  .ribbon { margin-left: auto; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--amber-tint); color: var(--amber); padding: 5px 11px; border-radius: 999px }
  .progress { max-width: 860px; margin: 0 auto; padding: 0 20px 14px }
  .prog-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 8px }
  .prog-row button { border: 0; background: none; color: var(--slate-d); font-weight: 700; font-size: 12.5px; text-decoration: underline; padding: 0 }
  .segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px }
  .segs i { height: 6px; border-radius: 99px; background: var(--track); transition: background .3s }
  .segs i.on { background: var(--slate) }

  /* feed */
  main { max-width: 860px; margin: 0 auto; padding: 22px 20px 190px }
  .m { display: flex; gap: 12px; margin-bottom: 18px; animation: rise .35s ease both }
  .m.user { justify-content: flex-end }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .av { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--slate-dd), var(--slate)); color: #fff; font: 800 12px Manrope }
  .bub { max-width: min(640px, 100%); padding: 14px 16px; border-radius: 16px; border-top-left-radius: 5px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); font-size: 14.5px; color: var(--body) }
  .bub b { color: var(--ink) }
  .bub p { margin: 0 0 8px }
  .bub p:last-child { margin: 0 }
  .m.user .bub { background: var(--slate-d); color: #fff; border-color: transparent; border-radius: 16px; border-top-right-radius: 5px; box-shadow: none }
  .m.user .bub { background: linear-gradient(135deg, var(--slate-dd), var(--slate)) }
  .bub.wide { width: 100%; max-width: 720px }

  /* intro / paste */
  textarea { width: 100%; min-height: 110px; resize: vertical; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px }
  textarea:focus, input[type=text]:focus, input[type=number]:focus, input[type=date]:focus { outline: none; border-color: var(--slate); box-shadow: 0 0 0 3px color-mix(in srgb, var(--slate) 22%, transparent) }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px }
  .link { border: 0; background: none; color: var(--slate-d); font-weight: 700; font-size: 13px; text-decoration: underline; padding: 4px 2px }

  /* status */
  .stat { display: grid; gap: 8px; font-size: 13.5px }
  .stat .t { font-weight: 700; color: var(--slate-d); font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em }
  .st { display: flex; align-items: center; gap: 10px; color: var(--faint) }
  .st .d { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none }
  .st.act { color: var(--ink); font-weight: 600 }
  .st.act .d { border-color: var(--slate); border-top-color: transparent; animation: spin .8s linear infinite }
  .st.done { color: var(--muted) }
  .st.done .d { background: var(--slate); border-color: var(--slate); color: #fff }
  .st.done .d svg { width: 10px; height: 10px }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* captured */
  .cap { display: grid; gap: 8px; margin-top: 10px }
  .cap div { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--ok-tint); font-size: 13.5px }
  .cap .ck { width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; flex: none }
  .cap .ck { min-width: 20px; max-width: 20px; height: 20px }
  .cap .ck svg { width: 11px; height: 11px }
  .cap span { color: var(--muted); min-width: 120px }
  .cap b { color: var(--ink) }

  /* question */
  .q-h { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--slate-d); margin-bottom: 6px }
  .q-h em { font-style: normal; color: var(--faint); font-weight: 600 }
  .q-t { font: 700 17px Manrope, sans-serif; color: var(--ink); margin-bottom: 4px }
  .q-s { font-size: 13px; color: var(--muted); margin-bottom: 4px }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
  .opt { border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: all .15s }
  .opt:hover { border-color: var(--slate); background: var(--slate-tint); transform: translateY(-1px) }
  .opt.on { background: var(--slate-d); border-color: var(--slate-d); color: #fff }
  .cust { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap }
  .cust input { height: 40px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; min-width: 190px }
  .done-card { opacity: .65; pointer-events: none }

  /* review */
  .rv { display: grid; gap: 12px; margin-top: 12px }
  .rg { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface) }
  .rg h4 { margin: 0; padding: 10px 14px; font: 700 12px Manrope; letter-spacing: .05em; text-transform: uppercase; color: var(--slate-d); background: var(--slate-tint) }
  .ri { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px }
  .ri:first-of-type { border-top: 0 }
  .ri small { color: var(--muted); font-size: 12.5px }
  .ri b { color: var(--ink); font-weight: 600 }
  .ri .link { font-size: 12.5px }
  .tags { display: flex; flex-wrap: wrap; gap: 6px }
  .tag { padding: 3px 10px; border-radius: 999px; background: var(--slate-tint-2); color: var(--slate-dd); font-size: 12.5px; font-weight: 600 }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 14px }
  .success { display: grid; gap: 10px; justify-items: start }
  .big-ok { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--ok-tint); color: var(--ok) }
  .big-ok svg { width: 22px; height: 22px }

  /* dock */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: linear-gradient(to top, var(--bg) 62%, transparent); padding: 28px 20px 18px }
  .dock-in { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 18px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow) }
  .dock-in:focus-within { border-color: var(--slate) }
  .dock-in input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 14.5px; color: var(--ink); min-width: 0 }
  .send { width: 42px; height: 42px; border: 0; border-radius: 13px; background: linear-gradient(135deg, var(--slate-dd), var(--slate)); color: #fff; display: grid; place-items: center }
  .send svg { width: 18px; height: 18px }
  .hint { max-width: 860px; margin: 8px auto 0; font-size: 12px; color: var(--faint); text-align: center }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(20, 28, 34, .45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s }
  .scrim.on { opacity: 1; pointer-events: auto }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 41; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .28s cubic-bezier(.2, .8, .3, 1); display: flex; flex-direction: column }
  .drawer.on { transform: none }
  .dr-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line) }
  .dr-b { padding: 8px 20px 20px; overflow: auto; flex: 1 }
  .dr-i { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center }
  .dr-i small { color: var(--muted); font-size: 12px; grid-column: 1 }
  .dr-i b { grid-column: 1; font-weight: 600; font-size: 14px }
  .dr-i .empty { color: var(--faint); font-weight: 500 }
  .dr-i .link { grid-row: 1 / span 2; grid-column: 2 }
  .x { border: 0; background: var(--slate-tint); width: 32px; height: 32px; border-radius: 10px; color: var(--slate-d); font-size: 18px }
  .toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(20px); background: var(--slate-dd); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60 }
  .toast.on { opacity: 1; transform: translateX(-50%) }
  @media (max-width: 640px) { .ri { grid-template-columns: 1fr auto } .ri small { grid-column: 1 / -1 } .crumb { display: none } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="logo">CC</span>
    <div class="crumb">New job posting<b id="ttl">Acme Corp — Cloud Engineer</b></div>
    <span class="ribbon">Proposed design</span>
  </div>
  <div class="progress">
    <div class="prog-row"><span id="progTxt">0 of 9 details captured</span><button id="openDrawer">View job summary</button></div>
    <div class="segs" id="segs"></div>
  </div>
</header>

<main id="feed" aria-live="polite"></main>

<div class="dock">
  <form class="dock-in" id="composer" autocomplete="off">
    <input id="msg" type="text" placeholder="Type your answer, or paste the job description…" aria-label="Message Skai">
    <button class="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2v6z"/></svg></button>
  </form>
  <div class="hint">Skai fills in your job posting as you go. Nothing is posted until you review and confirm.</div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Job summary">
  <div class="dr-h"><div><h3>Your job posting so far</h3><small style="color:var(--muted)" id="drSub"></small></div><button class="x" id="closeDrawer" aria-label="Close">×</button></div>
  <div class="dr-b" id="drBody"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
const SAMPLE = 'Senior AWS & Snowflake data engineer for a cloud migration, 40 hrs/week, remote, around $150/hr, starting in 2 weeks for about 6 months. Python and Terraform required, Databricks is a plus.';
const PROJECT = 'Acme Corp — Cloud Engineer';

/* the questions Skai may ask — in the order a client thinks about a hire */
const Q = [
  { k: 'why', label: 'Reason for hiring', q: 'Why are you hiring a consultant?', opts: ['New technology implementation', 'Add capacity to my team', 'Specialist skills we lack', 'Replace a departing consultant', 'Rescue a project'] },
  { k: 'seniority', label: 'Seniority', q: 'What seniority level do you need?', s: 'Junior 1–2 yrs · Mid-level 3–5 · Senior 6–9 · Principal 10+', opts: ['Junior', 'Mid-level', 'Senior', 'Principal'] },
  { k: 'hours', label: 'Hours per week', q: 'How many hours per week do you need?', opts: ['10', '20', '30', '40'], unit: ' hrs / week', custom: { type: 'number', ph: 'Other (hours)' } },
  { k: 'start', label: 'Ideal start', q: 'When would you like them to start?', opts: ['As soon as possible', 'In 2–4 weeks', 'In 1–2 months'], custom: { type: 'date', ph: '' } },
  { k: 'duration', label: 'Engagement length', q: 'How long do you expect the engagement to run?', opts: ['1–3 months', '3–6 months', '6–12 months', '12+ months', 'Not sure yet'] },
  { k: 'rate', label: 'Hourly budget', q: 'What hourly budget are you working with?', s: 'An estimate is fine — you can refine it later.', opts: ['$80–100 / hr', '$100–130 / hr', '$130–160 / hr', '$160+ / hr'], custom: { type: 'text', ph: 'Or type your own' } },
  { k: 'location', label: 'Work location', q: 'Where will the work happen?', opts: ['Remote', 'Hybrid', 'On-site'] },
  { k: 'skills', label: 'Must-have skills', q: 'Which skills or technologies are must-haves?', s: 'Pick all that apply, or add your own.', multi: true, opts: ['AWS', 'Azure', 'Snowflake', 'Databricks', 'Python', 'SQL', 'Terraform', 'Kubernetes', 'Salesforce', 'MuleSoft'] },
  { k: 'signoff', label: 'Final sign-off', q: 'Who has the final sign-off on this hire?', opts: ['Me', 'Hiring manager', 'Department head', 'Procurement / Finance'] }
];
const GROUPS = [['Why & who', ['why', 'seniority']], ['The engagement', ['hours', 'start', 'duration', 'rate']], ['Skills & location', ['skills', 'location']], ['Approval', ['signoff']]];
const A = {};            // answers
let cur = null;          // key currently being asked
let editing = false;     // re-asking a single answer from the summary
let reviewShown = false;
let busy = false;

const $ = s => document.querySelector(s);
const feed = $('#feed');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const qOf = k => Q.find(x => x.k === k);
const val = k => Array.isArray(A[k]) ? A[k].join(', ') : A[k];
const unitVal = k => { const q = qOf(k), v = val(k); return v && q.unit && /^\d+$/.test(v) ? v + q.unit : v };

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200) }
function scroll() { setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 60) }
function add(html, cls = 'bot', id) {
  const d = document.createElement('div'); d.className = 'm ' + cls; if (id) d.id = id;
  d.innerHTML = cls === 'user' ? `<div class="bub">${html}</div>` : `<span class="av">SK</span><div class="bub ${cls.includes('wide') ? 'wide' : ''}">${html}</div>`;
  feed.appendChild(d); scroll(); return d
}
const bot = (h, wide) => add(h, wide ? 'bot wide' : 'bot');
const me = h => add(esc(h), 'user');

function progress() {
  const n = Q.filter(q => A[q.k] && A[q.k].length).length;
  $('#progTxt').textContent = n + ' of ' + Q.length + ' details captured';
  $('#segs').innerHTML = Q.map(q => `<i class="${A[q.k] && A[q.k].length ? 'on' : ''}"></i>`).join('');
  $('#drSub').textContent = n + ' of ' + Q.length + ' details captured';
  $('#drBody').innerHTML = Q.map(q => `<div class="dr-i"><small>${q.label}</small><b class="${A[q.k] && A[q.k].length ? '' : 'empty'}">${A[q.k] && A[q.k].length ? esc(unitVal(q.k)) : 'Not answered yet'}</b>${A[q.k] && A[q.k].length ? `<button class="link" data-change="${q.k}">Change</button>` : ''}</div>`).join('')
}

/* ---------- the opening: describe it, or be asked ---------- */
function start() {
  progress();
  bot(`<p>Hi Olivia 👋 I’ll help you create the job posting for <b>${esc(PROJECT)}</b>.</p><p><b>Describe the role in your own words</b> — paste a job description, notes, anything. I’ll pick out the details and only ask about what’s missing.</p>
    <textarea id="intro" placeholder="e.g. We need a senior AWS engineer, 40 hrs/week, remote, around $150/hr…"></textarea>
    <div class="row"><button class="btn p" id="goIntro">Analyse my description</button><button class="btn" id="useSample">Use an example</button><button class="link" id="skipIntro">Skip — just ask me questions</button></div>`, true);
}

/* ---------- reading what the client wrote ---------- */
function parse(t) {
  const x = t.toLowerCase(), p = {};
  const sen = x.match(/principal|staff|senior|sr\.|mid[- ]?level|junior|entry/); if (sen) p.seniority = /principal|staff/.test(sen[0]) ? 'Principal' : /senior|sr\./.test(sen[0]) ? 'Senior' : /mid/.test(sen[0]) ? 'Mid-level' : 'Junior';
  const h = x.match(/(\d{1,2})\s*(?:hrs?|hours?)\b/); if (h) p.hours = String(Math.min(80, +h[1])); else if (/full[- ]?time/.test(x)) p.hours = '40';
  const r = x.match(/\$\s?(\d{2,3})(?:\s*[-–]\s*\$?(\d{2,3}))?\s*(?:\/|per|an)?\s*(?:hr|hour)?/); if (r) p.rate = '$' + r[1] + (r[2] ? '–' + r[2] : '') + ' / hr';
  if (/remote/.test(x)) p.location = 'Remote'; else if (/hybrid/.test(x)) p.location = 'Hybrid'; else if (/on[- ]?site/.test(x)) p.location = 'On-site';
  const w = x.match(/in (\d+)\s*weeks?/); if (w) p.start = +w[1] <= 1 ? 'As soon as possible' : +w[1] <= 4 ? 'In 2–4 weeks' : 'In 1–2 months'; else if (/asap|immediately|right away/.test(x)) p.start = 'As soon as possible'; else if (/next month/.test(x)) p.start = 'In 2–4 weeks';
  const d = x.match(/(\d+)\s*(?:-|to|–)?\s*(\d+)?\s*months?/); if (d) { const n = +(d[2] || d[1]); p.duration = n <= 3 ? '1–3 months' : n <= 6 ? '3–6 months' : n <= 12 ? '6–12 months' : '12+ months' }
  if (/replac/.test(x)) p.why = 'Replace a departing consultant'; else if (/rescue|stabili[sz]e|troubleshoot/.test(x)) p.why = 'Rescue a project'; else if (/capacity|extra hands|augment/.test(x)) p.why = 'Add capacity to my team'; else if (/migrat|implement|new platform|build/.test(x)) p.why = 'New technology implementation';
  const sk = Qskills().filter(s => x.includes(s.toLowerCase())); if (sk.length) p.skills = sk;
  return p
}
const Qskills = () => qOf('skills').opts;

/* ---------- showing Skai working, not just a spinner ---------- */
async function working(title, steps, ms = 520) {
  const d = bot(`<div class="stat"><div class="t">${title}</div>${steps.map((s, i) => `<div class="st" data-i="${i}"><span class="d"></span>${s}</div>`).join('')}</div>`);
  for (let i = 0; i < steps.length; i++) {
    const el = d.querySelectorAll('.st')[i]; el.classList.add('act'); await sleep(ms);
    el.classList.remove('act'); el.classList.add('done'); el.querySelector('.d').innerHTML = CHECK
  }
  await sleep(220); return d
}

async function analyse(text) {
  if (busy) return; busy = true;
  me(text.length > 140 ? text.slice(0, 140) + '…' : text);
  await working('Skai is reading your description', ['Reading your description', 'Spotting role, seniority and skills', 'Checking budget, hours and timeline', 'Filling in your job posting']);
  const p = parse(text), keys = Object.keys(p);
  keys.forEach(k => A[k] = p[k]); progress();
  if (keys.length) bot(`<p>Here’s what I picked up — <b>${keys.length} detail${keys.length > 1 ? 's' : ''}</b> captured:</p><div class="cap">${Q.filter(q => p[q.k]).map(q => `<div><span class="ck">${CHECK}</span><span>${q.label}</span><b>${esc(Array.isArray(p[q.k]) ? p[q.k].join(', ') : unitVal(q.k))}</b></div>`).join('')}</div><p class="note">You can change any of these at the end.</p>`);
  else bot('<p>I couldn’t pick out specific details from that — no problem, I’ll just ask you a few quick questions.</p>');
  busy = false; next()
}

/* ---------- one question at a time ---------- */
function next() {
  const q = Q.find(x => !(A[x.k] && A[x.k].length));
  if (!q) return review();
  ask(q.k)
}
function ask(k, isEdit) {
  const q = qOf(k); cur = k; editing = !!isEdit;
  const n = Q.filter(x => A[x.k] && A[x.k].length).length + 1;
  const sel = Array.isArray(A[k]) ? A[k] : [];
  bot(`<div class="q-h">${isEdit ? 'Update' : 'Question ' + Math.min(n, Q.length) + ' of ' + Q.length}</div><div class="q-t">${q.q}</div>${q.s ? `<div class="q-s">${q.s}</div>` : ''}
    <div class="opts" data-q="${k}">${q.opts.map(o => `<button class="opt ${sel.includes(o) ? 'on' : ''}" data-opt="${esc(o)}">${esc(o)}${q.unit && /^\d+$/.test(o) ? q.unit : ''}</button>`).join('')}</div>
    ${q.custom ? `<div class="cust"><input type="${q.custom.type}" ${q.custom.type === 'number' ? 'min="1" max="80"' : ''} placeholder="${q.custom.ph}" data-cust="${k}"><button class="btn sm" data-usecust="${k}">Use this</button></div>` : ''}
    ${q.multi ? `<div class="cust"><input type="text" placeholder="Add another skill" data-addskill><button class="btn sm" data-addskillbtn>Add</button></div><div class="row"><button class="btn p" data-multidone>Continue</button></div>` : ''}`)
}
function answer(k, v, label) {
  const q = qOf(k); A[k] = v; progress();
  const shown = label || (Array.isArray(v) ? v.join(', ') : unitVal(k));
  document.querySelectorAll('.opts[data-q="' + k + '"]').forEach(o => o.closest('.bub').classList.add('done-card'));
  me(shown);
  if (editing) { editing = false; cur = null; toast(q.label + ' updated'); return review(true) }
  cur = null; setTimeout(next, 350)
}

/* ---------- review: the whole posting, readable at a glance ---------- */
function review(again) {
  reviewShown = true; cur = null;
  const row = k => { const q = qOf(k), has = A[k] && A[k].length; return `<div class="ri"><small>${q.label}</small>${k === 'skills' && has ? `<div class="tags">${A[k].map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>` : `<b>${has ? esc(unitVal(k)) : '—'}</b>`}<button class="link" data-change="${k}">Change</button></div>` };
  bot(`<p><b>${again ? 'Updated — here’s your job posting.' : 'That’s everything I need.'}</b> Please review your job posting for <b>${esc(PROJECT)}</b> before it goes live.</p>
    <div class="rv">${GROUPS.map(([t, ks]) => `<div class="rg"><h4>${t}</h4>${ks.map(row).join('')}</div>`).join('')}</div>
    <div class="row"><button class="btn p" data-post>Post job &amp; find matches</button><button class="btn" data-draft>Save as draft</button></div>
    <p class="note">Matched consultants appear once the job is posted. You can still edit the posting afterwards.</p>`, true)
}
async function post(btn) {
  if (busy) return; busy = true; document.querySelectorAll('[data-post],[data-draft]').forEach(b => b.disabled = true);
  me('Post job & find matches');
  await working('Posting your job', ['Saving your job posting', 'Publishing to the Cloud Club network', 'Matching consultants to your requirements', 'Ranking the best fits']);
  bot(`<div class="success"><span class="big-ok">${CHECK}</span><h3>Your job is posted — 5 consultants matched</h3><p style="margin:0">Your closest matches are <b>CC-128</b> (96%) and <b>CC-141</b> (92%).</p><div class="row" style="margin-top:4px"><button class="btn p" data-view>View matched consultants</button><button class="btn" data-edit-post>Edit job posting</button></div></div>`, true);
  busy = false
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target, c = s => t.closest(s);
  let el;
  if (c('#useSample')) { $('#intro').value = SAMPLE; $('#intro').focus(); return }
  if (c('#goIntro')) { const v = $('#intro').value.trim(); if (!v) { $('#intro').focus(); toast('Describe the role first, or skip to answer questions'); return } c('.bub').classList.add('done-card'); analyse(v); return }
  if (c('#skipIntro')) { c('.bub').classList.add('done-card'); me('Skip — ask me questions'); bot('<p>Sure — I’ll ask a few quick questions, one at a time.</p>'); setTimeout(next, 450); return }
  if ((el = c('[data-opt]'))) {
    const k = el.closest('.opts').dataset.q, q = qOf(k);
    if (q.multi) { el.classList.toggle('on'); return }
    answer(k, el.dataset.opt); return
  }
  if ((el = c('[data-usecust]'))) { const k = el.dataset.usecust, i = el.closest('.cust').querySelector('input'), v = i.value.trim(); if (!v) { i.focus(); return } answer(k, v, qOf(k).unit && /^\d+$/.test(v) ? v + qOf(k).unit : v); return }
  if (c('[data-addskillbtn]')) { const i = $('[data-addskill]'), v = i.value.trim(); if (!v) return; const box = document.querySelector('.opts[data-q="skills"]:last-of-type') || document.querySelector('.opts[data-q="skills"]'); const b = document.createElement('button'); b.className = 'opt on'; b.dataset.opt = v; b.textContent = v; box.appendChild(b); i.value = ''; return }
  if (c('[data-multidone]')) { const box = c('.bub').querySelector('.opts'), sel = [...box.querySelectorAll('.opt.on')].map(b => b.dataset.opt); if (!sel.length) { toast('Pick at least one skill'); return } answer('skills', sel); return }
  if ((el = c('[data-change]'))) { closeDrawer(); const k = el.dataset.change; me('Change ' + qOf(k).label.toLowerCase()); bot('<p>Sure — let’s update that.</p>'); ask(k, true); return }
  if (c('[data-post]')) { post(); return }
  if (c('[data-draft]')) { toast('Saved as a draft in Searches'); return }
  if (c('[data-view]')) { toast('In the portal this opens the matched consultants page'); return }
  if (c('[data-edit-post]')) { toast('In the portal this opens the editable Job posting tab'); return }
  if (c('#openDrawer')) { openDrawer(); return }
  if (c('#closeDrawer') || c('#scrim')) { closeDrawer(); return }
});
function openDrawer() { $('#drawer').classList.add('on'); $('#scrim').classList.add('on') }
function closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on') }

$('#composer').addEventListener('submit', e => {
  e.preventDefault(); const i = $('#msg'), v = i.value.trim(); if (!v || busy) return; i.value = '';
  const intro = $('#intro');
  if (intro && !intro.closest('.bub').classList.contains('done-card')) { intro.closest('.bub').classList.add('done-card'); analyse(v); return }
  if (cur) {
    const q = qOf(cur), p = parse(v);
    if (q.multi) { const sk = p.skills || v.split(/,|\band\b/).map(s => s.trim()).filter(Boolean); answer(cur, sk); return }
    if (q.k === 'hours') { const n = (v.match(/\d+/) || [])[0]; if (n) { answer(cur, String(Math.min(80, +n))); return } }
    answer(cur, p[cur] || v); return
  }
  me(v); const p = parse(v); const ks = Object.keys(p);
  if (ks.length) { ks.forEach(k => A[k] = p[k]); progress(); bot('<p>Got it — I’ve updated <b>' + ks.map(k => qOf(k).label.toLowerCase()).join(', ') + '</b>.</p>'); if (reviewShown) review(true) }
  else bot('<p>I’ve noted that. Use <b>Change</b> in the review above to edit a specific detail.</p>')
});

start();
</script>
</body>
</html>
