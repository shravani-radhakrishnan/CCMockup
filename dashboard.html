<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Club — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Cloud Club brand system (matches product) ---- */
    --bg:#f8fafb;
    --surface:#ffffff;
    --ink:#262b2f;
    --body:#495259;
    --muted:#68727a;
    --faint:#8b949b;
    --line:#dfe4e8;
    --line-2:#d3dade;
    --track:#e7edf1;
    --slate:#547691;
    --slate-d:#3e566a;
    --slate-dd:#2c3e4c;
    --slate-tint:#eef3f6;
    --slate-tint-2:#e2ebf0;
    --slate-text:#567188;
    --ok:#3f9e83;
    --ok-tint:#e5f4ee;
    --amber:#c98a2e;
    --amber-tint:#faf1e2;
    --danger:#b4462f;
    --danger-tint:#f7e6e1;
    --card-shadow: 0 24px 64px rgba(65,82,96,.08);
    --card-shadow-lg: 0 32px 80px -12px rgba(44,62,76,.22);
    --r-card:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","DM Sans Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.brand,.headline{font-family:"Manrope","Manrope Variable",sans-serif}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}
  * { scrollbar-width:thin; scrollbar-color: rgba(84,118,145,.25) transparent }
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(84,118,145,.25);border-radius:99px}

  /* ---------- layout: slim icon rail + airy canvas ---------- */
  #app{display:flex;min-height:100vh}
  .rail{
    width:84px;flex:0 0 84px;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:22px 0 18px;position:sticky;top:0;height:100vh;gap:22px
  }
  .rail-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--slate),var(--slate-d));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px -6px rgba(62,86,106,.5)}
  .rail-new{
    width:46px;height:46px;border-radius:14px;background:var(--slate-d);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;transition:transform .16s,box-shadow .16s,background .16s
  }
  .rail-new:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 26px -10px rgba(62,86,106,.55);background:var(--slate-dd)}
  .rail-new:active{transform:translateY(0) scale(.98)}
  .rail-nav{display:flex;flex-direction:column;gap:6px;align-items:center}
  .rail-item{
    width:56px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:12px;
    border:none;background:transparent;color:var(--muted);transition:background .15s,color .15s,transform .15s
  }
  .rail-item svg{flex:0 0 auto}
  .rail-item span{font-size:9.5px;font-weight:600;letter-spacing:.01em;line-height:1.15;text-align:center}
  .rail-item:hover{background:var(--slate-tint);color:var(--slate-d);transform:translateY(-1px)}
  .rail-item.active{background:var(--slate-tint);color:var(--slate-d)}
  .rail-item.active::before{content:'';position:absolute}
  .rail-spacer{flex:1}

  .main{flex:1;min-width:0;padding:26px 32px 70px;position:relative}
  @media (min-width:900px){ .main{padding:28px 44px 70px} }
  @media (min-width:1280px){ .main{padding:32px 56px 70px} }
  @media (min-width:1680px){ .main{padding:36px 72px 70px} }
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:relative;z-index:20}
  .crumb{font-size:12px;color:var(--faint);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;background:var(--slate-tint);color:var(--slate-d);border:1.5px solid var(--slate-tint-2);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;transition:box-shadow .15s
  }
  .avatar-btn:hover{box-shadow:0 0 0 4px var(--slate-tint)}
  .avatar-menu{
    position:absolute;top:48px;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--card-shadow-lg);width:240px;padding:6px 0;opacity:0;transform:translateY(-6px) scale(.98);
    pointer-events:none;transition:opacity .16s ease,transform .16s ease
  }
  .avatar-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .avatar-menu .who{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
  .avatar-menu .org{color:var(--slate-d);font-weight:700;font-size:14px}
  .avatar-menu .email{color:var(--muted);font-size:12.5px;margin-top:2px}
  .avatar-menu button{
    width:100%;display:flex;align-items:center;gap:10px;padding:11px 18px;background:none;border:none;
    font-size:13.5px;color:var(--ink);font-weight:500;transition:background .12s
  }
  .avatar-menu button:hover{background:var(--slate-tint)}

  .content{width:100%;max-width:1720px;margin:0 auto}
  .content.content-enter{animation:riseIn .38s cubic-bezier(.19,1,.22,1) both}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .pagehead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px}
  .pagehead h1{font-size:25px;margin:0 0 4px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
  .pagehead p{margin:0;color:var(--muted);font-size:13.5px;max-width:520px}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:10px 16px;font-size:13.5px;font-weight:600;border:1.5px solid transparent;transition:transform .12s,box-shadow .12s,background .12s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--slate-d);color:#fff}
  .btn.primary:hover{background:var(--slate-dd);box-shadow:0 14px 26px -12px rgba(62,86,106,.5)}
  .btn.primary:disabled{background:#b7c2c9;cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:var(--surface);color:var(--slate-d);border-color:var(--line-2)}
  .btn.ghost:hover{border-color:var(--slate);color:var(--slate-dd)}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 22px;box-shadow:var(--card-shadow)}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
  .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.orange{background:var(--danger-tint);color:var(--danger)}
  .badge.gray{background:var(--track);color:var(--muted)}
  .badge.mint{background:var(--ok-tint);color:var(--ok)}
  .badge.amber{background:var(--amber-tint);color:var(--amber)}

  /* ---- hero / KPI strip (home view) ---- */
  .hero{
    background:linear-gradient(120deg,var(--slate-dd) 0%,var(--slate-d) 46%,var(--slate) 100%);
    border-radius:20px;padding:28px 30px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;
    box-shadow:0 30px 60px -22px rgba(44,62,76,.55)
  }
  .hero::after{
    content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)
  }
  .hero::before{
    content:'';position:absolute;left:30%;bottom:-90px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%)
  }
  .hero-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
  .hero-top h1{font-size:23px;margin:0 0 6px;font-weight:800}
  .hero-top p{margin:0;font-size:13px;color:rgba(255,255,255,.75);max-width:440px}
  .hero-kpis{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .kpi{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:15px 18px;backdrop-filter:blur(6px)}
  .kpi .n{font-size:24px;font-weight:800;font-family:"Manrope",sans-serif;display:flex;align-items:baseline;gap:6px}
  .kpi .n .trend{font-size:11px;font-weight:700;color:#bfe4d6}
  .kpi .l{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:2px}

  /* searches list */
  .search-card{margin-bottom:14px;transition:transform .18s,box-shadow .18s;cursor:pointer}
  .search-card:hover{transform:translateY(-3px);box-shadow:var(--card-shadow-lg)}
  .search-card .meta-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:11.5px}
  .search-card h3{margin:0 0 2px;font-size:15.5px;display:flex;align-items:center;gap:8px}
  .search-card .role{color:var(--muted);font-size:12.5px;margin-bottom:2px}
  .search-card .starts{color:var(--faint);font-size:12px;margin-bottom:10px}
  .search-card .snippet{font-size:13px;color:var(--body);opacity:.9;line-height:1.55;margin-bottom:12px}
  .search-card .continue{color:var(--slate-d);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
  .pencil{opacity:.45}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}

  /* chat + brief split */
  .split{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
  @media (max-width:900px){.split{grid-template-columns:1fr}}
  .chat-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;min-height:520px;overflow:hidden}
  .chat-scroll{flex:1;padding:26px 26px 10px;overflow-y:auto;max-height:560px}
  .skai-hero{text-align:center;padding:6px 10px 18px}
  .skai-avatar{
    width:48px;height:48px;border-radius:14px;background:linear-gradient(155deg,var(--slate),var(--slate-d));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin:0 auto 14px;
    box-shadow:0 10px 22px -8px rgba(62,86,106,.5)
  }
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .skai-hero h2{font-size:19px;margin:0 0 6px;font-weight:800}
  .skai-hero h2 small{font-size:12px;font-weight:400;color:var(--muted)}
  .skai-hero p{color:var(--muted);font-size:13.5px;max-width:400px;margin:0 auto}
  .skai-callout{background:var(--slate-tint);border:1px solid var(--slate-tint-2);color:var(--slate-dd);border-radius:13px;padding:13px 16px;font-size:12.5px;line-height:1.6;margin:16px 0}
  .skai-callout b{color:var(--slate-d)}
  .upload-drop{border:1.5px dashed var(--line-2);border-radius:13px;padding:13px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;transition:border-color .15s,background .15s;cursor:pointer;margin-bottom:14px}
  .upload-drop:hover{border-color:var(--slate);background:var(--slate-tint)}
  .upload-drop b{color:var(--slate-d)}
  .upload-parsing{border:1px solid var(--slate-tint-2);background:var(--slate-tint);border-radius:13px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
  .upload-done{border:1px solid var(--ok-tint);background:var(--ok-tint);border-radius:13px;padding:12px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
  .upload-done.upload-enter{animation:riseIn .3s ease both}
  .upload-done .ok-ic{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:12px}
  .mini-ring{width:32px;height:32px;flex:0 0 auto}
  .parse-status{font-size:12.5px;color:var(--slate-dd);font-weight:600}
  .parse-status span{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}

  .msg{max-width:82%;margin-bottom:14px;font-size:13.5px;line-height:1.6;animation:riseIn .3s ease both;border-radius:15px;padding:12px 16px}
  .msg.user{margin-left:auto;background:var(--slate-d);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{background:var(--track);color:var(--ink);border-bottom-left-radius:4px}
  .msg.bot b{color:var(--slate-dd)}
  .typing{display:inline-flex;gap:4px;background:var(--track);padding:12px 16px;border-radius:15px;border-bottom-left-radius:4px;width:fit-content;margin-bottom:14px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:block;animation:bounce 1.1s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

  .chat-input-row{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center}
  .chat-input-row input{flex:1;border:1.5px solid var(--line-2);border-radius:12px;padding:11px 14px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .15s}
  .chat-input-row input:focus{border-color:var(--slate)}
  .send-btn{width:38px;height:38px;border-radius:50%;background:var(--slate-d);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .15s,transform .15s}
  .send-btn:hover{background:var(--slate-dd);transform:scale(1.05)}
  .send-btn:disabled{background:#bcc7cd;cursor:not-allowed;transform:none}
  .attach-btn{width:38px;height:38px;border-radius:50%;background:var(--slate-tint);color:var(--slate-d);border:none;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:background .15s}
  .attach-btn:hover{background:var(--slate-tint-2)}

  /* brief / candidates panel */
  .brief-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--card-shadow);overflow:hidden}
  .tabbar{display:flex;border-bottom:1px solid var(--line)}
  .tabbar button{flex:1;padding:14px 10px;background:none;border:none;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s}
  .tabbar button.active{color:var(--slate-d);border-color:var(--slate-d)}
  .brief-body{padding:20px 22px;max-height:640px;overflow-y:auto}
  .jd-complete-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .jd-complete-row b{font-size:12px;color:var(--ink)}
  .jd-pct{font-size:15px;font-weight:800;color:var(--slate-d)}
  .jd-track{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-bottom:6px}
  .jd-fill{height:100%;background:linear-gradient(90deg,var(--slate),var(--slate-d));border-radius:99px;transition:width 1s cubic-bezier(.22,.9,.3,1)}
  .jd-hint{font-size:11.5px;color:var(--faint);margin-bottom:18px}
  .jd-field{margin-bottom:14px}
  .jd-field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .jd-field .val{min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink);background:var(--surface);transition:background .5s,border-color .3s}
  .jd-field .val.empty{color:#b3bcc0;font-style:italic}
  .jd-field .val.flash{background:var(--slate-tint);border-color:var(--slate)}
  .jd-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .jd-chipwrap{display:flex;flex-wrap:wrap;gap:6px}
  .jd-chip{background:var(--slate-tint);color:var(--slate-d);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;animation:pop .25s ease both}
  .jd-search-btn{width:100%;margin-top:6px;justify-content:center}

  /* searching loader */
  .searching-wrap{padding:34px 10px 10px;text-align:center}
  .search-ring{width:100px;height:100px;margin:0 auto 20px;position:relative}
  .search-ring .pulse{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--slate-tint-2);animation:pulseRing 2.2s ease-out infinite}
  @keyframes pulseRing{0%{transform:scale(.72);opacity:.9}100%{transform:scale(1.28);opacity:0}}
  .search-title{font-size:16px;font-weight:800;margin-bottom:4px}
  .search-sub{color:var(--muted);font-size:12.5px;margin-bottom:24px;min-height:18px}
  .steps{text-align:left;max-width:290px;margin:0 auto 22px}
  .step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px;color:var(--faint);opacity:.55;transition:opacity .3s}
  .step.active{opacity:1;color:var(--ink);font-weight:600}
  .step.done{opacity:1;color:var(--slate-d)}
  .step .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .25s}
  .step.active .dot{border-color:var(--slate);box-shadow:0 0 0 4px var(--slate-tint)}
  .step.done .dot{background:var(--slate-d);border-color:var(--slate-d);color:#fff}
  .tip-carousel{background:var(--track);border-radius:13px;padding:12px 16px;font-size:11.5px;color:var(--muted);max-width:320px;margin:0 auto;min-height:40px;display:flex;align-items:center;justify-content:center;transition:opacity .25s}

  /* candidates */
  .filter-row{margin-bottom:14px}
  .filter-row .flabel{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .fchip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--ink);transition:all .15s}
  .fchip.active{background:var(--slate-d);border-color:var(--slate-d);color:#fff}
  .fchip:hover{border-color:var(--slate)}

  .cand-card{border:1px solid var(--line);border-radius:15px;padding:16px 18px;margin-bottom:14px;transition:box-shadow .18s,transform .18s}
  .cand-card.cand-enter{animation:riseIn .35s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 90ms)}
  .cand-card:hover{box-shadow:var(--card-shadow);transform:translateY(-2px)}
  .cand-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cand-id{display:flex;align-items:center;gap:10px}
  .cand-avatar{width:36px;height:36px;border-radius:11px;background:var(--slate-tint);color:var(--slate-d);font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .cand-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .cand-role{color:var(--muted);font-size:12.5px;margin-top:1px}
  .match-ring{position:relative;width:46px;height:46px}
  .match-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--slate-dd)}
  .avail-pill{display:inline-flex;align-items:center;gap:6px;background:var(--ok-tint);color:var(--ok);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;margin:10px 0}
  .avail-pill.later{background:var(--amber-tint);color:var(--amber)}
  .avail-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .cand-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px;margin-bottom:10px}
  .cand-meta span b{color:var(--muted);font-weight:600;margin-right:4px}
  .cand-skills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .skill-pill{background:var(--track);font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;color:var(--ink)}
  .why-box{background:var(--slate-tint);border-radius:11px;padding:12px 14px;margin:10px 0;font-size:12px;line-height:1.6}
  .why-box .why-t{font-weight:700;color:var(--slate-dd);margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .why-box ul{margin:0;padding-left:18px}
  .rate-line{font-weight:800;font-size:14px;margin:8px 0 2px;color:var(--ink)}
  .rate-line span{display:block;font-weight:400;font-size:11px;color:var(--faint)}

  .refer-hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}

  .company-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}

  .kv .v{font-size:13.5px}
  .kv .v.muted{color:#b3bcc0}
  .pillset{display:flex;flex-wrap:wrap;gap:6px}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}

  .chip-status.pending{background:var(--amber-tint);color:var(--amber)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------------- onboarding handoff ---------------- */
function loadOnboardingProfile(){

}
const ONB = loadOnboardingProfile();
const TECH_AREA_LABELS = { crm:'CRM & Customer Platforms', sales:'Sales & Revenue', service:'Customer Service & Success', mktg:'Marketing & Commerce', finops:'Finance & Operations', data:'Data, Analytics & AI', it:'IT, Cloud & Engineering', integ:'Integration & Automation', hr:'HR & Talent', other:'Other', unsure:'I’m not sure' };

/* ---------------- demo data ---------------- */
const ORG = { name: (ONB && ONB.company) || 'XYZ Corp', email: (ONB && ONB.workemail) || 'smanduva@cloudclub.ai', initials: ((ONB && ONB.company) || 'XYZ Corp').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() };

const SEARCHES = [{
  id:1, title:'Salesforce Application Developer — Enhancement, Integration', created:'Sep 10, 2026', starts:'09-09-2026',
  role:'Salesforce Application Developer',
  snippet:'“Perfect — searching for Senior Salesforce Techno-Functional consultants with Commerce Cloud and Agentforce experience now/Now let me pull certifications for both candidates. I’ve populated the right side of your screen wit…”'
}];

const PROJECTS = [{ title:'Salesforce Application Developer', created:'Sep 10, 2026', start:'Sep 10, 2026', end:'Sep 02, 2026' }];

const CANDIDATES = [
  { id:'CC-141', fit:'Strong Fit', match:92, role:'Senior Salesforce Solutions Architect & Developer', avail:'Available for project start', availLater:false,
    exp:'13 years', region:'US - Central', rate:'$160–175/hr',
    skills:['Commerce Cloud','Sales Cloud','Service Cloud','Experience Cloud','Marketing Cloud','CPQ','Commerce Cloud','Agentforce (Einstein Bots)'],
    why:['13 years of Salesforce experience with direct Commerce Cloud expertise — aligns with your core go-to-market stack','Einstein Bots experience translates to Agentforce configuration for the new region’s sales team','Multi-Org Strategy skill is a direct match for standing up a new org and business unit from scratch','Financial Services and FinTech-adjacent experience with strong solution design capabilities','Full-time availability (40 hrs/week) means fully dedicated to your project from day one'],

    industries:['Financial Services','Technology','Manufacturing','Retail'],
    standout:['Commerce Cloud implementation and configuration expertise','Multi-org strategy and new org setup experience','Strong solution design + MuleSoft integration background'] },
  { id:'CC-145', fit:'Strong Fit', match:86, role:'Senior Salesforce Techno-Functional Consultant', avail:'Available in ~3 weeks', availLater:true,
    exp:'15 years', region:'US - East', rate:'$140–155/hr',
    skills:['Sales Cloud','Service Cloud','CPQ','Data Cloud'],
    why:['15 years across Sales and Service Cloud with hands-on CPQ configuration','Prior experience leading a techno-functional team through a multi-org migration','Comfortable owning both discovery workshops and hands-on build'],

    industries:['Retail','Healthcare'],
    standout:['CPQ rollout across 3 business units','Led techno-functional workstream for a national retailer'] }
];

const TIPS = [
  'Consultants who respond to a brief within 24 hours are matched 2x faster.',
  'Adding a rate range up front reduces back-and-forth by ~30%.',
  'Cloud Club vets every consultant’s certifications before they appear in your matches.',
  'You can message a shortlisted consultant directly once you book an interview.'
];

const SCRIPT = [
  {
    user:'Looking for a strategy consultant to help our fintech company enter a new market. Experience with financial services and go-to-market planning.',
    bot:`That's an exciting initiative — entering a new market is a significant strategic move, and getting the right support makes a real difference.<br><br>I want to make sure I point you in the right direction: <b>Cloud Club specializes in Salesforce consulting talent</b> — so if your market entry work involves standing up or optimizing Salesforce for the new market (CRM, sales process, customer onboarding, partner management, etc.), I can absolutely help you find the right person.<br><br>However, if you're looking for a <b>pure business strategy or go-to-market strategy consultant</b> (market sizing, competitive analysis, positioning decks, investor strategy), that falls outside what we do here.`,
    pct:13, fields:{ title:'Salesforce Application Developer', engagement:'T&M (Time & Materials)' }
  },
  {
    user:'setting up Salesforce in a new region (new org, new business unit, new sales team)',
    bot:`Absolutely — let me run that search now!<br><br>One quick thing before I do: your job description shows a <b>seniority level of "Mid"</b> — but given you're a small team of 5 and need someone to independently set up a new org, new business unit, and new sales team across Commerce Cloud and Agentforce, I'd typically recommend leaning <b>Senior</b>.<br><br><b>Should I search for Senior consultants, or stick with Mid-level?</b> This will help me surface the most relevant profiles for you.`,

  }
];

/* ---------------- state ---------------- */
let VIEW = 'searches';
let lastRenderedView = null;
let menuOpen = false;
let kebabOpen = null;
let toastQ = [];
let modal = null; // 'referral'
let referrals = [];

let NS = null; // new-search session state
function freshNS(prefilled){
  return {
    stage: prefilled ? 'results' : 'chat',
    turn: prefilled ? SCRIPT.length : 0,
    typing:false,
    messages: prefilled ? [] : [],
    jd: prefilled ? { title:'Salesforce Application Developer', engagement:'T&M (Time & Materials)', location:'Remote', start:'09-09-2026', end:'09-02-2026', hours:'40', rate:'$160–175/hr' } : { title:'', engagement:'', location:'', start:'', end:'', hours:'', rate:'' },
    pct: prefilled ? 92 : 0,
    upload:'idle', uploadPct:0,
    activeTab: prefilled ? 'candidates' : 'jd',
    searchStep:0, tipIdx:0,
    filter:{ rel:null, avail:null, fit:null },
    expanded:{}, candJustEntered: prefilled
  };
}

const COMPANY = {
  // "About [Company]" — captured on the "About your company" onboarding screen
  a:{
    company: (ONB && ONB.company) || 'XYZ Corp',
    website: (ONB && ONB.website) || '',

};

/* ---------------- icons ---------------- */
const ICON = {
  folder:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>',
  clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  chat:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 01-12.4 7.55L3 20l1.1-4.2A8.5 8.5 0 1121 11.5z"/></svg>',
  brief:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
  dollar:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M17 6.5c0-2-2-3-5-3s-5 1.4-5 3.2 2 2.9 5 3.3 5 1.6 5 3.4-2 3.1-5 3.1-5-1-5-3"/></svg>',
  users:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.7-3.6 3.2-5.5 6.5-5.5s5.8 1.9 6.5 5.5"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M15.8 14.7c2.6.3 4.4 2 5 5.3"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  clip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8V6a4 4 0 018 0v9a5 5 0 01-10 0V9a2.5 2.5 0 015 0v7.5"/></svg>',
  send:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2v6z"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>',
  arrow:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  edit:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  cloud:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 18a4 4 0 010-8 5 5 0 019.5-1.8A4.5 4.5 0 0118 18H6z"/></svg>',
  gift:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M3 9h18M12 9v12M12 9c-1.5-3-6-3-6-1s2.5 1 6 1zM12 9c1.5-3 6-3 6-1s-2.5 1-6 1z"/></svg>',
  trend:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>'
};
function matchColor(pct){ return pct>=90 ? 'var(--ok)' : 'var(--slate-d)'; }
function ringSVG(pct, size=32, stroke=4, color){
  color = color || 'var(--slate-d)';
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--track)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.3,1)"/></svg>`;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- render ---------------- */

function crumbFor(view){
  return { searches:'Previous Searches', newsearch:'New Search', projects:'Projects', payments:'Payments', referrals:'Referrals', company:'Company Profile', interviews:'Interviews' }[view] || 'Dashboard';
}
function railItem(key, icon, label){

  if(VIEW==='company') return viewCompany();

  if(VIEW==='payments') return viewPayments();
  if(VIEW==='referrals') return viewReferrals();
  if(VIEW==='newsearch') return viewNewSearch();
  return viewSearches();

  return `

  const jd = NS.jd, pct = NS.pct;

  `;
  const candTab = candidatesBody();
  return `
  <div class="pagehead">

  </div>
  <div class="split">
    <div class="chat-panel">
      <div class="chat-scroll" id="chatScroll">
        ${NS.messages.length===0?`
          <div class="skai-hero">
            <div class="skai-avatar">SK</div>
            <h2>Hi ${esc(ORG.name.split(' ')[0])}, I'm Skai <small>(pronounced “Sky”)</small></h2>

/* ---------------- interactions ---------------- */
function showToast(msg){
  const t={msg,out:false}; toastQ.push(t); render();
  setTimeout(()=>{ t.out=true; render(); },1800);
  setTimeout(()=>{ toastQ=toastQ.filter(x=>x!==t); render(); },2100);
}
function animateCountUps(){
  document.querySelectorAll('[data-countup]').forEach(el=>{
    const target=Number(el.dataset.countup); let cur=0;
    const trend = el.querySelector('.trend');
    const step=()=>{ cur+=1; if(cur>=target){cur=target;} el.childNodes[0].nodeValue=cur; if(cur<target) requestAnimationFrame(step); };
    el.childNodes[0] ? (el.childNodes[0].nodeValue='0') : null;
    requestAnimationFrame(step);
  });
}
function animateMatchRings(){
  document.querySelectorAll('[data-match]').forEach(el=>{
    const target=Number(el.dataset.match); const color=el.dataset.color;
    const circle = el.querySelectorAll('circle')[1];
    const numEl = el.querySelector('.num');
    if(circle){ const r=circle.r.baseVal.value, c=2*Math.PI*r; circle.style.strokeDashoffset=c; requestAnimationFrame(()=>{ circle.style.strokeDashoffset = c*(1-target/100); }); }
    let cur=0; const step=()=>{ cur+=Math.max(1,Math.round((target-cur)/6)); if(cur>=target) cur=target; numEl.textContent=cur; if(cur<target) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function scrollChatBottom(){ const el=document.getElementById('chatScroll'); if(el) el.scrollTop=el.scrollHeight; }

function wire(){
  const app=document.getElementById('app');
  if(VIEW==='searches') animateCountUps();
  if(NS && NS.stage==='results') animateMatchRings();
  scrollChatBottom();

  app.addEventListener('click', onClick);
  const input=document.getElementById('chatInput');
  if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
}
function onClick(e){
  const t=e.target;
  const goto=t.closest('[data-goto]'); if(goto){ VIEW=goto.dataset.goto; menuOpen=false; render(); return; }
  if(t.closest('[data-newsearch]')){ NS=freshNS(false); VIEW='newsearch'; render(); return; }
  if(t.closest('[data-continue-search]')){ NS=freshNS(true); VIEW='newsearch'; render(); return; }
  if(t.closest('[data-avatar]')){ menuOpen=!menuOpen; render(); return; }
  if(t.closest('[data-signout]')){ menuOpen=false; render(); showToast('Signed out (demo)'); return; }
  if(!t.closest('.avatar-menu') && !t.closest('[data-avatar]') && menuOpen){ menuOpen=false; render(); return; }
  if(t.closest('[data-send]')){ sendMessage(); return; }
  if(t.closest('[data-upload-doc]')){ startUpload(); return; }
  if(t.closest('[data-tab]')){ NS.activeTab=t.closest('[data-tab]').dataset.tab; render(); return; }
  if(t.closest('[data-search-matches]')){ startSearch(); return; }
  if(t.closest('[data-expand]')){ const id=t.closest('[data-expand]').dataset.expand; NS.expanded[id]=!NS.expanded[id]; render(); return; }
  if(t.closest('[data-filter]')){ const [k,v]=t.closest('[data-filter]').dataset.filter.split(':'); NS.filter[k]=NS.filter[k]===v?null:v; render(); return; }
  if(t.closest('[data-bookinterview]')){ showToast('Interview requested with '+t.closest('[data-bookinterview]').dataset.bookinterview); return; }
  if(t.closest('[data-viewprofile]')){ showToast('Opening full profile (demo)'); return; }
  if(t.closest('[data-kebab]')){ const i=Number(t.closest('[data-kebab]').dataset.kebab); kebabOpen = kebabOpen===i?null:i; render(); return; }
  if(t.closest('[data-toast]')){ kebabOpen=null; showToast(t.closest('[data-toast]').dataset.toast); return; }
  if(t.closest('[data-refer-now]')){ modal='referral'; render(); return; }
  if(t.closest('[data-close-modal]') || t.closest('[data-modal-overlay]')===t){ modal=null; render(); return; }
  if(t.closest('[data-invite-referral]')){
    const name=document.getElementById('refName').value.trim()||'Sam';
    const email=document.getElementById('refEmail').value.trim()||'referral@example.com';
    referrals.push({name,email}); modal=null; render(); showToast('Referral invited!'); return;
  }
  if(t.closest('[data-edit-a]')){ COMPANY.editingA=true; render(); return; }
  if(t.closest('[data-cancel-a]')){ COMPANY.editingA=false; render(); return; }
  if(t.closest('[data-save-a]')){
    COMPANY.a.company=document.getElementById('cCompany').value;
    COMPANY.a.industry=document.getElementById('cIndustry').value;
    COMPANY.a.employees=document.getElementById('cEmployees').value;
    COMPANY.a.website=document.getElementById('cWebsite').value;
    COMPANY.a.location=document.getElementById('cLocation').value;
    COMPANY.a.heard=document.getElementById('cHeard').value;
    ORG.name = COMPANY.a.company;
    COMPANY.editingA=false; render(); showToast('Company profile updated'); return;
  }
  if(t.closest('[data-edit-b]')){ COMPANY.editingB=true; render(); return; }
  if(t.closest('[data-cancel-b]')){ COMPANY.editingB=false; render(); return; }
  if(t.closest('[data-save-b]')){
    COMPANY.b.usecase=document.getElementById('cUsecase').value;
    COMPANY.b.goal=document.getElementById('cGoal').value;
    if(COMPANY.b.firmtype) COMPANY.b.firmtype=document.getElementById('cStage').value; else COMPANY.b.stage=document.getElementById('cStage').value;
    COMPANY.editingB=false; render(); showToast('Cloud Club profile updated'); return;
  }
  if(kebabOpen!==null && !t.closest('.kebab')){ kebabOpen=null; render(); return; }
}

function sendMessage(){
  if(NS.typing) return;
  const input=document.getElementById('chatInput');
  const turn = SCRIPT[NS.turn];
  const userText = (input && input.value.trim()) || (turn ? turn.user : 'Tell me more about my requirements.');
  NS.messages.push({who:'user', text:userText});
  if(input) input.value='';
  NS.typing=true; render(); scrollChatBottom();
  setTimeout(()=>{
    NS.typing=false;
    if(turn){
      NS.messages.push({who:'bot', text:turn.bot});
      Object.assign(NS.jd, turn.fields);
      NS.pct = turn.pct;
      NS.turn++;
    } else {
      NS.messages.push({who:'bot', text:'Got it — I\'ve noted that. Feel free to add anything else, or click <b>Search for Matches</b> when you\'re ready.'});
    }
    render(); scrollChatBottom();
    document.querySelectorAll('[data-flash]').forEach(el=>{ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),900); });
  }, 900);
}
function startUpload(){
  if(NS.upload!=='idle') return;
  NS.upload='parsing'; NS.uploadPct=0; render();
  const iv=setInterval(()=>{
    NS.uploadPct=Math.min(100, NS.uploadPct+ (8+Math.random()*10));
    if(NS.uploadPct>=100){
      clearInterval(iv);
      NS.upload='done'; NS.uploadJustDone=true;
      NS.jd.title = NS.jd.title || 'Salesforce Application Developer';
      NS.jd.engagement = NS.jd.engagement || 'T&M (Time & Materials)';
      NS.jd.location = NS.jd.location || 'Remote';
      NS.jd.start = NS.jd.start || '09-10-2026';
      NS.jd.end = NS.jd.end || '09-02-2026';
      NS.jd.hours = NS.jd.hours || '40';
      NS.jd.rate = NS.jd.rate || '$130–$150/hr';
      NS.pct = Math.max(NS.pct, 78);
      render();
      document.querySelectorAll('[data-flash]').forEach(el=>{ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),900); });
      return;
    }
    render();
  }, 260);
}
function startSearch(){
  NS.stage='searching'; NS.searchStep=0; NS.tipIdx=0; render();
  const tipIv=setInterval(()=>{ NS.tipIdx++; const el=document.querySelector('.tip-carousel'); if(el){ el.style.opacity=0; setTimeout(()=>{ const e2=document.querySelector('.tip-carousel'); if(e2){ e2.textContent='💡 '+TIPS[NS.tipIdx%TIPS.length]; e2.style.opacity=1; } },200); } },1400);
  const stepIv=setInterval(()=>{
    NS.searchStep++;
    if(NS.searchStep>=4){
      clearInterval(stepIv); clearInterval(tipIv);
      NS.stage='results'; NS.activeTab='candidates'; NS.candJustEntered=true; render();
      return;
    }
    render();
  }, 850);
}

render();
</script>
