      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: var(--slate-dd)
    }

    .skai .avail-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ok-tint);
      color: var(--ok);
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      margin: 10px 0
    }

    .skai .avail-pill.later {
      background: var(--amber-tint);
      color: var(--amber)
    }

    .skai .avail-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor
    }

    .skai .cand-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 12.5px;
      margin-bottom: 10px
    }

    .skai .cand-meta span b {
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px
    }

    .skai .cand-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px
    }

    /* compact candidates */
    .skai .ctool {

      padding: 0 6px 0 11px;
      border-radius: 99px;
      background: var(--slate-tint-2);
      color: var(--slate-dd);
      font-size: 12px;
      font-weight: 600
    }

    .skai .jd-tag button {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 0;
      background: rgba(84, 118, 145, .3);
      color: inherit;
      font-size: 11px;
      line-height: 1;
      padding: 0
    }

    .skai .jd-tag button:hover {
      background: var(--danger);
      color: #fff
    }

    .skai .jd-addbtn {
      height: 26px;
      padding: 0 10px;
      border-radius: 99px;
      border: 1.5px dashed var(--line-2);
      background: none;
      color: var(--slate-d);
      font-size: 11.5px;
      font-weight: 700
    }

    .skai .jd-addbtn:hover {
      border-color: var(--slate);
      background: var(--slate-tint)
    }

    .skai .jd-addin {
      height: 28px;
      width: 150px;
      border: 1.5px solid var(--slate);
      border-radius: 99px;
      padding: 0 12px;
      font: inherit;
      font-size: 12px;
      outline: 0;
      background: var(--surface);
      color: var(--ink)
    }

    .skai .jd-eg {
      font-size: 11px;
      color: var(--faint);
      font-style: italic;
      margin-top: 4px
    }

    @keyframes barIn {
      from {
        transform: scaleX(0)
      }
    }

    @keyframes ring {
      from {
        opacity: 0;
        transform: scale(.85)
      }
    }

    .page,
    .skai {
      overflow-anchor: none
    }

    /* ===== Skai screen: brief left, AI chat right ===== */
    .sk2-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .sk2-head h1 {
      font-size: 28px;
      margin: 2px 0 0;
      letter-spacing: -.02em
    }

    .sk2-crumb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 10px;
      border-radius: 99px;
      background: var(--slate-tint-2);
      color: var(--slate-d);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .sk2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 460px;
      gap: 24px;
      align-items: start
    }

    @media(max-width:1100px) {
      .sk2 {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .sk2-left {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      min-width: 0
    }

    .sk2-top {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, var(--surface) 0%, var(--slate-tint) 100%);
      box-shadow: var(--card-shadow);
      flex-wrap: wrap
    }

    .sk2-ring {
      position: relative;
      width: 76px;
      height: 76px;
      flex: 0 0 76px
    }

    .sk2-ring b {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 800 19px "Manrope", sans-serif;
      color: var(--slate-dd)
    }

    .sk2-ring b small {
      font-size: 10px;
      margin-left: 1px;
      align-self: center;
      margin-top: 3px
    }

    .sk2-top-t {
      flex: 1;
      min-width: 200px
    }

    .sk2-top-t b {
      font: 700 16px "Manrope", sans-serif
    }

    .sk2-top-t p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .sk2-sit {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .sk2-sit span {
      height: 22px;
      padding: 0 10px;
      border-radius: 99px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      font-size: 11px;
      font-weight: 600;
      color: var(--slate-d);
      display: inline-flex;
      align-items: center
    }

    .sk2-cta {
      height: 44px;
      padding: 0 20px;
      gap: 8px
    }

    .sk2-seg {
      display: inline-flex;
      padding: 4px;
      border-radius: 14px;
      background: var(--slate-tint);
      border: 1px solid var(--line);
      width: max-content;
      max-width: 100%
    }

    .sk2-seg button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: none;
      color: var(--muted);
      font: 600 13px "DM Sans", sans-serif;
      transition: background-color .2s, color .2s, transform .2s
    }

    .sk2-seg button:hover {
      color: var(--slate-dd)
    }

    .sk2-seg button.on {
      background: var(--surface);
      color: var(--slate-dd);
      box-shadow: 0 2px 8px rgba(44, 62, 76, .12)
    }

    .sk2-seg em {
      font-style: normal;
      font-size: 11px;
      min-width: 20px;
      height: 20px;
      border-radius: 99px;
      background: var(--slate-tint-2);
      display: inline-grid;
      place-items: center;
      padding: 0 6px
    }

    .sk2-body {
      display: grid;
      gap: 16px;
      min-width: 0;
      animation: sk-riseIn .35s cubic-bezier(.19, 1, .22, 1) both
    }

    .sk2-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--card-shadow)
    }

    .sk2-card>header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px
    }

    .sk2-card>header i {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--slate-tint-2);
      color: var(--slate-d);
      display: grid;
      place-items: center
    }

    .sk2-card>header b {
      display: block;
      font: 700 15px "Manrope", sans-serif
    }

    .sk2-card>header small {
      color: var(--faint);
      font-size: 12px
    }

    .sk2-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 18px
    }

    @media(max-width:700px) {
      .sk2-grid {
        grid-template-columns: 1fr
      }
    }

    .sk2-f {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0
    }

    .sk2-f.wide {
      grid-column: 1/-1
    }

    .sk2-f>span,
    .sk2-list>span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--faint)
    }

    .sk2-in {
      height: 44px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      outline: 0;
      transition: border-color .18s, box-shadow .18s
    }

    .sk2-in::placeholder {
      color: #b3bcc0
    }

    .sk2-ta {
      height: auto;
      min-height: 104px;
      padding: 12px 14px;
      line-height: 1.5;
      resize: vertical
    }

    .sk2-f .sk2-note {
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: var(--muted)
    }

    .skai .eng-chip.num {
      min-width: 40px;
      padding: 0
    }

    .sk2-in:hover {
      border-color: var(--line-2)
    }

    .sk2-in:focus {
      border-color: var(--slate);
      box-shadow: 0 0 0 4px rgba(84, 118, 145, .16)
    }

    .sk2-list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .sk2-list em {
      font-size: 11px;
      color: var(--faint)
    }

    /* chat (right) */
    .sk2-chat {
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 112px);
      min-height: 520px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--card-shadow-lg);
      overflow: hidden
    }

    .sk2-chat>header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #2c3e4c 0%, #3e566a 55%, #547691 100%);
      color: #fff
    }

    .sk2-chat>header b {
      display: block;
      font: 700 15px "Manrope", sans-serif
    }

    .sk2-chat>header small {
      color: rgba(255, 255, 255, .72);
      font-size: 11.5px
    }

    /* minimize Skai chat */
    .sk2-min {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 0;
      background: rgba(255, 255, 255, .14);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color .18s
    }

    .sk2-min:hover {
      background: rgba(255, 255, 255, .26)
    }

    .sk2.min {
      grid-template-columns: minmax(0, 1fr)
    }

    .sk2-launch {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 54px;
      padding: 0 20px 0 8px;
      border: 0;
      border-radius: 99px;
      background: linear-gradient(135deg, #2c3e4c 0%, #3e566a 55%, #547691 100%);
      color: #fff;
      font: 700 14px "Manrope", sans-serif;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(44, 62, 76, .35);
      animation: sk-riseIn .35s cubic-bezier(.2, .8, .3, 1) both;
      transition: transform .18s
    }

    .sk2-launch:hover {
      transform: translateY(-2px)
    }

    .sk2-launch .sk2-av {
      width: 38px;
      height: 38px;
      border-radius: 50%
    }

    .sk2-launch .dot {
      position: absolute;
      top: 8px;
      right: 14px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3f9e83;
      border: 2px solid #2c3e4c
    }

    .sk2-av {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: rgba(255, 255, 255, .16);
      display: grid;
      place-items: center;
      font: 800 13px "Manrope", sans-serif
    }

    .sk2-av i {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #58d3a5;
      border: 2px solid #3e566a
    }

    .sk2-msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-anchor: none
    }

    .sk2-msgs>:first-child {
      margin-top: auto
    }

    @media(max-width:1100px) {
      .sk2-chat {
        position: relative;
        top: 0;
        margin-top: 0;
        height: 70vh
      }
    }

    .sk2-greet {
      padding: 4px 2px 8px
    }

    .sk2-greet h2 {
      font-size: 18px;
      margin: 0 0 6px
    }

    .sk2-greet h2 small {
      font: 500 12px "DM Sans", sans-serif;
      color: var(--muted)
    }

    .sk2-greet p {
      margin: 0;
      color: var(--muted);
      font-size: 13px
    }

    .sk2-chat .msg {
      max-width: 90%;
      margin: 0;
      padding: 11px 14px;
      border-radius: 16px 16px 16px 5px;
      background: var(--slate-tint);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.55
    }

    .sk2-chat .msg.user {
      align-self: flex-end;
      border-radius: 16px 16px 5px 16px;
      background: linear-gradient(135deg, var(--slate-d), var(--slate));
      color: #fff
    }

    .sk2-chat .typing {
      align-self: flex-start
    }

    .sk2-suggest {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 16px 0
    }

    .sk2-suggest button {
      max-width: 100%;
      height: 30px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--slate-d);
      font: 600 11.5px "DM Sans", sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color .18s, background-color .18s, transform .18s
    }

    .sk2-suggest button:hover {
      border-color: var(--slate);
      background: var(--slate-tint);
      transform: translateY(-1px)
    }

    .sk2-composer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 14px 14px;
      padding: 6px 6px 6px 16px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      transition: border-color .18s, box-shadow .18s
    }

    .wchk {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 0;
      border: 0;
      background: none;
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      align-self: flex-start
    }

    .wchk i {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1.5px solid var(--line-2);
      display: grid;
      place-items: center;
      transition: .18s
    }

    .wchk.on i {
      background: var(--slate-d);
      border-color: var(--slate-d)
    }

    .wchk.on i::after {
      content: "✓";
      color: #fff;
      font-size: 10px;
      font-weight: 800
    }

    .wchk:hover {
      color: var(--slate-dd)
    }

    .in:disabled {
      opacity: .55;
      cursor: not-allowed
    }

    .dtrows {
      display: grid;
      gap: 8px;
      margin-top: 16px
    }

    .dtl {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--body)
    }

    .dtr {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px;
      align-items: center
    }

    .dtr b {
      font-size: 13px
    }

    .dtr .in {
      height: 40px
    }

    .dtr.err .in {
      border-color: var(--danger)
    }

    @media(max-width:520px) {
      .dtr {
        grid-template-columns: 1fr
      }
    }

    .ctabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .ctab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1.5px solid var(--line-2);
      background: var(--surface);
      color: var(--body);
      font-weight: 700;
      font-size: 12.5px
    }

    .ctab.on {
      background: var(--slate-d);
      border-color: var(--slate-d);
      color: #fff
    }

    .ctab.err {
      border-color: var(--danger)
    }

    .ctab i {
      font-style: normal;
      min-width: 18px;
      height: 18px;
      border-radius: 99px;
      background: var(--slate-tint-2);
      color: var(--slate-dd);
      display: grid;
      place-items: center;
      font-size: 11px;
      padding: 0 5px
    }

    .ctab i.ok {
      background: var(--slate-d);
      color: #fff
    }

    .ctab.on i.ok {
      background: #fff;
      color: var(--slate-d)
    }

    .day.taken {
      opacity: .35;
      text-decoration: line-through
    }

    .prow {
      grid-template-columns: minmax(0, 1.5fr) minmax(0, .8fr) 140px 240px
    }

    .prow .pill {
      justify-self: start;
      white-space: nowrap
    }

    @media(max-width:1000px) {
      .prow {
        grid-template-columns: minmax(0, 1fr) auto;
        padding-left: 20px
      }

      .prow .prb {
        display: none
      }

      .pact {
        grid-column: 1/-1;
        justify-content: flex-start
      }
    }

    @media(max-width:560px) {
      .prow {
        grid-template-columns: 1fr
      }
    }

    .pact {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    .pact .btn[disabled] {
      opacity: .5;
      cursor: not-allowed
    }

    .hc {
      position: relative
    }

    .hc summary {
      list-style: none;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--slate-d);
      padding: 7px 12px;
      border-radius: 99px;
      background: var(--slate-tint)
    }

    .hc summary::-webkit-details-marker {
      display: none
    }

    .hc summary::after {
      content: ' ▾'
    }

    .hcl {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 5;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      padding: 8px;
      display: grid;
      gap: 4px;
      min-width: 150px
    }

    .hcl span {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 600
    }

    .hcl span>i.av,
    .hcl .av {
      flex: none !important;
      width: 28px !important;
      height: 28px !important;
      min-width: 28px;
      max-width: 28px;
      aspect-ratio: 1/1;
      border-radius: 50% !important;
      width: 26px;
      height: 26px;
      font-size: 10px;
      font-style: normal;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--slate);
      color: #fff
    }

    .tsback {
      border: 0;
      background: none;
      color: var(--slate);
      font-weight: 700;
      font-size: 13px;
      padding: 0;
      margin-bottom: 6px;
      cursor: pointer
    }

    .tsback:hover {
      color: var(--slate-dd)
    }

    .tsmeta {
      display: flex;
      gap: 6px 22px;
      flex-wrap: wrap
    }

    .tsmeta b {
      color: var(--ink);
      margin-right: 4px
    }

    .ts {
      display: grid;
      gap: 18px
    }

    .tssel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    @media(max-width:700px) {
      .tssel {
        grid-template-columns: 1fr
      }
    }

    .tssel label span {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 5px
    }

    .tsmo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap
    }

    .tsmo b {
      font: 700 16px Manrope
    }

    .tssum {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 20px;
      align-items: center;
      padding: 16px 20px;
      border-radius: 14px;
      background: var(--slate-tint)
    }

    .tssum>div:first-child {
      display: grid;
      gap: 2px
    }

    .tssum b {
      font: 800 28px Manrope;
      color: var(--slate-d)
    }

    .tssum small {
      color: var(--muted)
    }

    .tsbar .bar {
      margin-bottom: 6px
    }

    .tsh {
      margin: 6px 0 -6px;
      font-size: 11.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--faint)
    }

    .tsweeks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px
    }

    .tsw {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      align-items: center;
      text-align: left;
      padding: 14px 16px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      cursor: pointer;
      transition: .18s
    }

    .tsw:hover {
      border-color: var(--slate)
    }

    .tsw.on {
      border-color: var(--slate-d);
      background: var(--slate-tint);
      box-shadow: 0 0 0 3px rgba(84, 118, 145, .14)
    }

    .tsr {
      font-weight: 700;
      font-size: 13px
    }

    .tsl {
      font-size: 12px;
      color: var(--muted);
      align-self: end;
      grid-column: 1
    }

    .tsw b {
      grid-column: 2
    }

    .tsw b {
      font: 800 20px Manrope;
      text-align: right
    }

    .pill.sm {
      font-size: 10.5px;
      padding: 2px 8px
    }

    .tsdays {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 10px
    }

    @media(max-width:900px) {
      .tsdays {
        grid-template-columns: repeat(4, minmax(0, 1fr))
      }
    }

    .tsdays>div {
      display: grid;
      gap: 2px;
      justify-items: center;
      padding: 12px 6px;

        case 'notifall': S.notifs.forEach(n => n.u = 0); render(false); break;
        case 'notif': { const n = S.notifs[+v]; n.u = 0; S.pop = false; doGo(n.go); break }
        case 'chat': S.chat = !S.chat; render(); break;
        case 'signout': toast('Signing you out…'); setTimeout(() => { window.location.href = 'index.html' }, 700); break;
        case 'refsend': { const el = $('#refmail'), m = (el && el.value || '').trim(); if (!/^\S+@\S+\.\S+$/.test(m)) { toast('Enter a valid email address'); el && el.focus(); break } S.refs = S.refs || REFS.slice(); S.refs.unshift({ who: m, co: '—', d: new Date().toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }), st: 'Invited', cr: 0, code: genRef() }); render(false); toast('Invitation sent to ' + m + ' with a one-time code'); break }

        case 'ivrm': { const [a, b] = v.split(':').map(Number), T = S.ivs[a][4], p = T[b]; T.splice(b, 1); render(false); toast(p.n + ' removed from this call'); break }

        case 'ivresume': { const k = CONS.find(x => x.n === v); if (k) { S.from = 'interviews'; S.pid = k.id; S.view = 'cprofile'; window.scrollTo(0, 0); render() } break }
        case 'copy': { navigator.clipboard?.writeText(S.refCode)?.catch(() => { }); S.refs = S.refs || REFS.slice(); if (!S.refShared) { S.refShared = true; S.refs.unshift({ who: 'Shared by code — awaiting sign-up', co: '—', d: new Date().toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }), st: 'Invited', cr: 0, code: S.refCode }) } render(false); toast('Code copied — it works for one person only'); break }
        case 'refnew': S.refCode = genRef(); S.refShared = false; render(false); toast('New one-time code generated'); break;
        case 'newoffer': { startIntake(); break }
        case 'newoffer_old': { const go2 = () => { resetWiz(); S.view = 'wizard'; S.pop = false; S.modal = null; window.scrollTo(0, 0); render() }; if (S.view === 'wizard' && S.wiz.step > 0 || S.view === 'results' || S.view === 'sched') { S.leaveTo = '__new'; S.modal = 'leave'; render() } else go2(); break }
        case 'edit': S.edit = v; render(); break;
        case 'canceledit': S.modal = 'cancel'; render(); break;
        case 'yescancel': S.edit = null; S.modal = null; render(); break;
        case 'saveedit': document.querySelectorAll('[data-p]').forEach(i => S.profile[i.dataset.p] = i.value); if (S.profile.company) { ORG.name = S.profile.company; ORG.ini = ORG.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() } S.edit = null; render(); toast('Profile updated'); break;
        case 'pcloud': { const c = S.profile.clouds, i = c.indexOf(v); i < 0 ? c.push(v) : c.splice(i, 1); render(); break }
        case 'upload': $('#docfile')?.click(); break;
        case 'rmdoc': S.docs.splice(+v, 1); render(); break;
        /* modals */
        case 'modal': S.modal = v; S.file = null; render(); break;
        case 'nosure': { const d2 = S.wiz.d, k = v; d2[k + 'No'] = !d2[k + 'No']; if (d2[k + 'No']) d2[k] = ''; delete S.wiz.err[k]; stepRender(); break }
        case 'closem': if (a.dataset.bg && e.target !== a) break; S.modal = null; render(); break;
        case 'leave': { const t = S.leaveTo; S.modal = null; S.leaveTo = null; if (t === '__new') { S.draft = null; resetWiz(); S.view = 'wizard'; window.scrollTo(0, 0); render() } else doGo(t); break }
        case 'skai': S.modal = null; if (S.draft && S.view === 'wizard') wizardToSkai(); else startIntake(); break;
        case 'skfill': { const t = (document.getElementById('skfillIn') || {}).value || ''; if (!t.trim()) { toast('Describe the role first'); break } skFillRun(t); break }
        case 'towskai': wizardToSkai(); break;
        case 'skai2form': skaiToForm(); break;
        case 'bookext': S.from = 'skai'; S.cur = { t: (NS && NS.jd.title) || 'Job offer' }; startSched([v]); break;
        case 'doupload': Object.assign(d, PRE()); S.modal = null; render(); toast('Pre-filled from ' + S.file.n + ' ✨'); break;
        case 'useoffer': Object.assign(d, PRE()); S.modal = null; render(); toast('Started from “' + S.offers[+v].t + '”'); break;
        /* wizard */
        case 'opt': d[a.dataset.k] = v; delete S.wiz.err[a.dataset.k]; if (a.dataset.k === 'btype') delete S.wiz.err.bamt; S.wiz.dir = ''; stepRender(); break;
        case 'msopen': S.ms = S.ms === a.dataset.k ? null : a.dataset.k; stepRender(); break;
        case 'msopt': { const k = a.dataset.k, i = d[k].indexOf(v); i < 0 ? d[k].push(v) : d[k].splice(i, 1); const gk = IMPG[k]; if (gk && i >= 0) delete d[gk][v]; delete S.wiz.err[k]; stepRender(); break }
        case 'imp': { const m = d[a.dataset.g], k = a.dataset.k; if (m[k] === v) delete m[k]; else m[k] = v; delete S.wiz.err[a.dataset.g + ':' + k]; stepRender(); break }
        case 'subadd': { const el = $('#subin'), t = (el && el.value || '').trim(); if (!t) { el && el.focus(); break } d.subs = d.subs || []; if (!d.subs.some(x => x.toLowerCase() === t.toLowerCase())) d.subs.push(t); stepRender(); $('#subin')?.focus(); break }
        case 'subrm': d.subs.splice(+v, 1); stepRender(); break;
        case 'addh': d.holders.push({ n: '', p: '' }); stepRender(); break;
        case 'rmh': d.holders.splice(+v, 1); stepRender(); break;
        case 'draft': {
          const d = S.wiz.d, sn = d.sen ? d.sen.split('-')[0].split(' ')[0] + ' ' : '', t = (sn + (d.rtype || 'Untitled role')).trim();
          if (!S.draft) { S.draft = { id: Date.now(), title: S.wiz.title || t, role: S.wiz.role || t, created: 'Today', starts: '—', n: 0, posted: false }; SEARCHES.unshift(S.draft) }
          S.draft.kind = 'wiz'; S.draft.wiz = S.wiz; S.draft.starts = d.start ? fmtDate(d.start) : '—';
          doGo('searches'); toast('Draft saved in Searches — continue it any time'); break
        }
        case 'back': S.wiz.step--; S.wiz.dir = 'bwd'; S.wiz.err = {}; S.ms = null; render(); window.scrollTo(0, 0); break;
        case 'next':
          if (!validate()) { showErr(); break }
          S.ms = null;
          if (S.wiz.step < STEPS.length - 1) { S.wiz.step++; S.wiz.dir = 'fwd'; render(); window.scrollTo(0, 0) } else postSearch();
          break;
        /* results */
        case 'csel': { const id = +v, i = S.sel.indexOf(id); i < 0 ? S.sel.push(id) : S.sel.splice(i, 1); stepRender(); break }
        case 'selall': { const vis = CONS.filter(x => S.vf !== 'Verified only' || x.ver).map(x => x.id); S.sel = vis.every(i => S.sel.includes(i)) ? [] : vis; stepRender(); break }
        case 'selclear': S.sel = []; stepRender(); break;
        case 'ctab': { const [i, j] = v.split(':'); S.tab[i] = +j; stepRender(); break }
        case 'more': S.more[v] = !S.more[v]; stepRender(); break;
        case 'invite1': S.from = 'results'; startSched([+v]); break;
        case 'invite': S.from = 'results'; startSched([...S.sel]); break;
        case 'cprof': S.from = 'results'; S.pid = +v; S.view = 'cprofile'; window.scrollTo(0, 0); render(); break;
        case 'backres': S.view = S.from === 'skai' ? 'skai' : S.from === 'interviews' ? 'interviews' : 'results'; window.scrollTo(0, 0); render(); break;
        case 'reachlist': { const x = SEARCHES[+v]; if (x) { x.reach = true; render(false); toast('Request sent — our team will reach out shortly') } break }
        case 'reachteam': { const x = SEARCHES[S.pidx]; if (x) { x.reach = true; render(false); toast('Request sent — our team will reach out shortly') } break }
        case 'rtab': S.rtab = v; render(false); break;
        case 'jpsave': {
          const w = S.wiz, keep = w.step, all = {}; for (let i = 0; i < STEPS.length; i++) { w.step = i; validate(); Object.assign(all, w.err) } w.step = keep; w.err = all;
          if (Object.keys(all).length) { stepRender(); toast('Please complete the required fields'); setTimeout(() => document.querySelector('.fld.err,.impr.err')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60); break }
          toast('Job posting updated'); break
        }
        /* schedule */
        case 'sfmt': S.sch.fmt = v; render(); break;
        case 'hr': case 'hrset': {
          const c = scd(sk()), d2 = a.dataset.d; let arr = c.tfs[d2] || [];
          if (a.dataset.a === 'hr') { const h = +v, i = arr.indexOf(h); i < 0 ? arr.push(h) : arr.splice(i, 1); arr.sort((x, y) => x - y) }
          else arr = v === 'am' ? [8, 9, 10, 11] : v === 'pm' ? [12, 13, 14, 15, 16] : v === 'day' ? [9, 10, 11, 12, 13, 14, 15, 16] : [];
          c.tfs[d2] = arr; S.sch.tfd = d2; delete S.sch.err['tf:' + sk() + ':' + d2]; if (cOk(c)) delete S.sch.err['c' + sk()]; stepRender(); break
        }
        case 'nextdate': { const c = scd(sk()), i = c.dates.indexOf(S.sch.tfd), nx = c.dates.slice(i + 1).concat(c.dates.slice(0, i + 1)).find(d => !hasT(c)(d)) || c.dates[(i + 1) % c.dates.length]; S.sch.tfd = nx; stepRender(); break }
        case 'sit': S.sch.it = v; delete S.sch.err.it; render(); break;
        case 'addiv': S.sch.iv.push({ n: '', e: '' }); render(); break;
        case 'rmiv': S.sch.iv.splice(+v, 1); render(); break;
        case 'cm': S.sch.m += +v; render(); break;
        case 'day': { const cc = scd(sk()), ds = cc.dates, i = ds.indexOf(v); i < 0 ? ds.push(v) : (ds.splice(i, 1), delete cc.tfs[v]); ds.sort(); delete S.sch.err['c' + sk()]; stepRender(); break }
        case 'stab': { S.sch.cur = +v; stepRender(); break }
        case 'gcal': {
          const s2 = S.sch; if (s2.gc) break;
          if (s2.g) { s2.g = false; toast('Calendar disconnected'); stepRender(); break }
          s2.gc = true; stepRender();
          setTimeout(() => {
            s2.gc = false; s2.g = true; let rm = 0; Object.values(s2.cd).forEach(c => { const keep = c.dates.filter(k => (+k.slice(-2) * 7) % 5 !== 0); rm += c.dates.length - keep.length; c.dates.filter(k => !keep.includes(k)).forEach(k => delete c.tfs[k]); c.dates = keep });
            toast(rm ? `Calendar synced — removed ${rm} date${rm > 1 ? 's' : ''} you're already booked on` : 'Google Calendar synced — busy days blocked'); if (S.view === 'sched') stepRender()
          }, 900); break
        }
        case 'sback': S.sch.step = 0; S.sch.dir = 'bwd'; S.sch.err = {}; render(); window.scrollTo(0, 0); break;
        case 'snext':
          if (!schValid()) { stepRender(); toast('Please complete the required fields'); break }
          if (S.sch.step === 0) { S.sch.step = 1; S.sch.dir = 'fwd'; render(); window.scrollTo(0, 0) }
          else { S.sch.sent = true; S.sel.forEach(i => { const c = scd(String(i)); S.ivs.unshift([getC(i).n, getC(i).r, 'Proposed: ' + c.dates.map(k => fmtD(k) + ' (' + fmtHrs(c.tfs[k]) + ')').join(' / '), 'Awaiting', [{ n: ORG.name + ' (you)', e: ORG.email, own: 1 }, ...S.sch.iv.filter(p => p.n.trim()).map(p => ({ n: p.n.trim(), e: p.e.trim() }))], S.sch.it]) }); S.modal = 'sent'; render(); confetti() }
          break
      }
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'avfile') {
        const f = el.files && el.files[0]; el.value = ''; if (!f) return; if (!/^image\/(png|jpe?g|webp)$/.test(f.type)) { toast('Please choose a JPG or PNG image'); return } if (f.size > 2 * 1048576) { toast('Image is larger than 2 MB'); return }
        const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'), n = 192; c.width = c.height = n; const x = c.getContext('2d'), m = Math.min(im.width, im.height); x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, n, n); S.avatar = c.toDataURL('image/jpeg', .85); save('ccp_av', S.avatar); render(false); toast('Profile photo updated') }; im.onerror = () => toast('Could not read that image'); im.src = r.result }; r.readAsDataURL(f); return
      }

      if (el.dataset && el.dataset.tsel && S.ts) { if (el.dataset.tsel === 'p') { S.ts = { p: el.value, c: pinfo(el.value).cons[0], m: 0, w: null } } else { S.ts.c = el.value; S.ts.w = null } render(false); return }
      if (el.dataset && el.dataset.payper !== undefined) { S.pay.per = +el.value; S.pay.page = 0; render(false); return }

      if (el.dataset.w && el.dataset.r) { S.wiz.d[el.dataset.w] = el.value; delete S.wiz.err[el.dataset.w]; stepRender() }
      else if (el.dataset.s) { S[el.dataset.s] = el.value; stepRender() }
      else if (el.dataset.dsel !== undefined) { S.sch.tfd = el.value; stepRender() }
      else if (el.dataset.sv) { S.sch[el.dataset.sv] = el.value; delete S.sch.err[el.dataset.sv]; stepRender() }
    });
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.dataset.w) { const k = el.dataset.w; S.wiz.d[k] = k === 'rate' ? +el.value : el.value; if (k === 'extra' && $('#cnt')) $('#cnt').textContent = el.value.length + '/250'; const f = el.closest('.fld'); if (f && el.value) { f.classList.remove('err'); delete S.wiz.err[k] } }
      else if (el.dataset.h) { const [i, k] = el.dataset.h.split(':'); S.wiz.d.holders[+i][k] = el.value; delete S.wiz.err['h' + i + k]; el.closest('.fld')?.classList.remove('err') }
      else if (el.dataset.iv) { const [i, k] = el.dataset.iv.split(':'); S.sch.iv[+i][k] = el.value; delete S.sch.err['i' + i + k]; el.closest('.fld')?.classList.remove('err') }
    });
    document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.slotf && NS && NS.slotsModal) { const [i, k] = el.dataset.slotf.split(':'); const x = NS.slotsModal.slots[+i]; x[k] = el.value; if (k === 's' && el.value && (!x.e || new Date(x.e) <= new Date(el.value))) { x.e = new Date(new Date(el.value).getTime() + 30 * 6e4); const d = x.e, p = n => String(n).padStart(2, '0'); x.e = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) } NS.slotsModal.touched = true; rerender() } });
    document.addEventListener('input', e => { if (e.target.matches && e.target.matches('[data-sqin]')) { const b = e.target.closest('.sq-ttl').querySelector('[data-a=sqsave]'); if (b) b.disabled = !e.target.value.trim() } });
    document.addEventListener('keydown', e => { if (e.target.matches && e.target.matches('[data-sqin]')) { if (e.key === 'Enter') { e.preventDefault(); e.target.closest('.sq-ttl').querySelector('[data-a=sqsave]').click() } else if (e.key === 'Escape') { S.sqEdit = null; render(false) } } });
    document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.querySelector('.search input')?.focus() } if (e.key === 'Escape' && S.modal && S.modal !== 'sent') { S.modal = null; render() } });
    resetWiz(); resetSch();
    NARROW.addEventListener('change', () => render(false));
    render();
